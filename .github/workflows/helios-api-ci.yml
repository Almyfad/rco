name: Deploy Helios API

on:
  push:
    paths:
      - 'helios/api/**'
      - 'helios/HeliosDataBaseContext/**'
      - '.github/workflows/helios-api-ci.yml'
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:
    
permissions:
  contents: read
  packages: write
env:
  ASPNETCORE_ENVIRONMENT: Production
  MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
  MYSQL_USER: ${{ vars.MYSQL_USER }}
  MYSQL_HOST: ${{ vars.MYSQL_HOST }}
  MYSQL_PORT: ${{ vars.MYSQL_PORT }}
  MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
  Configurations__jwt__secret: ${{ secrets.HELIOS_JWT_SECRET }}

jobs:
  get-env:
    runs-on: self-hosted
    outputs:
      env: ${{ steps.env.outputs.env }}
      short_env: ${{ steps.env.outputs.short_env }}
    steps:
      - uses: actions/checkout@v4
      - name: Get environment from branch
        id: env
        uses: ./.github/actions/set-env-from-branch

      - name: Show environment
        run: echo "Environment is ${{ steps.env.outputs.env }}"
  build:
    if:  github.ref == 'refs/heads/develop' 
    needs: get-env
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: package_version
        uses: KageKirin/get-csproj-version@v0
        with:
          file: helios/api/Helios.csproj
          xpath: '//PropertyGroup/AssemblyVersion'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push helios image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: helios
          file: helios/api/Dockerfile
          push: true
          tags: |
            ghcr.io/almyfad/helios:${{ steps.package_version.outputs.version }}
            ghcr.io/almyfad/helios:latest

  deploy:
    needs: get-env
    runs-on: self-hosted
    environment: ${{ needs.get-env.outputs.env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get version
        id: package_version
        uses: KageKirin/get-csproj-version@v0
        with:
          file: helios/api/Helios.csproj
          xpath: '//PropertyGroup/AssemblyVersion'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Create Docker secret
        run: |
          echo "${{ secrets.MYSQL_PASSWORD }}" > $HOME/helios/.secret.helios.${{ needs.get-env.outputs.short_env }}.mysql.password
          echo "${{ secrets.HELIOS_JWT_SECRET }}" > $HOME/helios/.secret.helios.${{ needs.get-env.outputs.short_env }}.jwt.secret

      - name: Install EF Core Tools
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Add EF Core Tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./helios/api

      - name: Validate environment variables
        run: |
          if [ -z "$MYSQL_DATABASE" ]; then echo "ERROR: MYSQL_DATABASE is not set"; exit 1; fi
          if [ -z "$MYSQL_USER" ]; then echo "ERROR: MYSQL_USER is not set"; exit 1; fi
          if [ -z "$MYSQL_HOST" ]; then echo "ERROR: MYSQL_HOST is not set"; exit 1; fi
          if [ -z "$MYSQL_PASSWORD" ]; then echo "ERROR: MYSQL_PASSWORD is not set"; exit 1; fi
          echo "✅ All required environment variables are set"

      - name: Apply EF Core Migrations
        run: |
         echo "Applying migrations for HeliosDataBaseContext..."
         echo "Database host: $MYSQL_HOST"
         echo "Database name: $MYSQL_DATABASE" 
         dotnet ef database update --configuration Release
        working-directory: ./helios/HeliosDataBaseContext

      - name: Generate ${{ needs.get-env.outputs.short_env }} compose to $HOME
        run: |
          mkdir -p $HOME/helios
          docker compose -f helios/docker-compose.yml -f helios/docker-compose.${{ needs.get-env.outputs.short_env }}.yml config > $HOME/helios/docker-compose.${{ needs.get-env.outputs.short_env }}.yml
          sed -i "s|image:.*helios:.*|image: ghcr.io/almyfad/helios:${{ steps.package_version.outputs.version }}|" $HOME/helios/docker-compose.${{ needs.get-env.outputs.short_env }}.yml

      - name: Show updated docker-compose.${{ needs.get-env.outputs.short_env }}.yml file
        run: cat $HOME/helios/docker-compose.${{ needs.get-env.outputs.short_env }}.yml

      - name: Deploy to ${{ needs.get-env.outputs.env }}
        run: cd $HOME/helios && docker compose  -f $HOME/helios/docker-compose.${{ needs.get-env.outputs.short_env }}.yml up -d
