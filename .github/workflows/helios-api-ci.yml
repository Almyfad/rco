name: Deploy Helios API

on:
  push:
    paths:
      - 'helios/api/**'
      - 'helios/HeliosDataBaseContext/**'
      - '.github/workflows/helios-api-ci.yml'
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

env:
  ASPNETCORE_ENVIRONMENT: Production
  MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
  MYSQL_USER: ${{ vars.MYSQL_USER }}
  MYSQL_HOST: ${{ vars.MYSQL_HOST }}
  MYSQL_PORT: ${{ vars.MYSQL_PORT }}
  MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
  Configurations__jwt__secret: ${{ secrets.HELIOS_JWT_SECRET }}

jobs:
  build:
    runs-on: self-hosted
    outputs:
      env: ${{ steps.set_env.outputs.env }}
      short_env: ${{ steps.set_env.outputs.short_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Set environment from branch
        id: set_env
        uses: ./.github/actions/set-env-from-branch

      - name: Build Docker image
        run: cd helios && docker build -f api/Dockerfile --force-rm -t helios:latest .

      - name: Generate ${{ steps.set_env.outputs.short_env }} compose to $HOME
        run: |
          mkdir -p $HOME/helios
          cp helios/api/Dockerfile $HOME/helios/Dockerfile
          docker compose -f helios/docker-compose.yml -f helios/docker-compose.${{ steps.set_env.outputs.short_env }}.yml config > $HOME/helios/docker-compose.${{ steps.set_env.outputs.short_env }}.yml

  deploy:
    needs: build
    runs-on: self-hosted
    environment: ${{ needs.build.outputs.env }}
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Create Docker secret
        run: |
          echo "${{ secrets.MYSQL_PASSWORD }}" > $HOME/helios/.secret.helios.${{ needs.build.outputs.short_env }}.mysql.password
          echo "${{ secrets.HELIOS_JWT_SECRET }}" > $HOME/helios/.secret.helios.${{ needs.build.outputs.short_env }}.jwt.secret

      - name: Install EF Core Tools
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Add EF Core Tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./helios/api

      - name: Validate environment variables
        run: |
          if [ -z "$MYSQL_DATABASE" ]; then echo "ERROR: MYSQL_DATABASE is not set"; exit 1; fi
          if [ -z "$MYSQL_USER" ]; then echo "ERROR: MYSQL_USER is not set"; exit 1; fi
          if [ -z "$MYSQL_HOST" ]; then echo "ERROR: MYSQL_HOST is not set"; exit 1; fi
          if [ -z "$MYSQL_PASSWORD" ]; then echo "ERROR: MYSQL_PASSWORD is not set"; exit 1; fi
          echo "✅ All required environment variables are set"

      - name: Apply EF Core Migrations
        run: |
         echo "Applying migrations for HeliosDataBaseContext..."
         echo "Database host: $MYSQL_HOST"
         echo "Database name: $MYSQL_DATABASE" 
         dotnet ef database update --configuration Release
        working-directory: ./helios/HeliosDataBaseContext

      - name: Deploy to ${{ needs.build.outputs.env }}
        run: cd $HOME/helios && docker compose  -f $HOME/helios/docker-compose.${{ needs.build.outputs.short_env }}.yml up -d --build --force-recreate
