services:
  intranet-staging:
    container_name: intranet-staging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=rconetwork"
      - "traefik.http.routers.intranet.rule=Host(`intranet-staging.rose-croix-d-or.org`) && PathPrefix(`/`)"
      - "traefik.http.routers.intranet.entrypoints=websecure"