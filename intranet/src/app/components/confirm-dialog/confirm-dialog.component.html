<div class="confirm-dialog">
  <h2 mat-dialog-title class="dialog-title">
    <mat-icon class="dialog-icon">{{ icon }}</mat-icon>
    {{ title }}
  </h2>
  
  <mat-dialog-content class="dialog-content">
    <p>{{ message }}</p>
  </mat-dialog-content>
  
  <mat-dialog-actions class="dialog-actions">
    <button 
      mat-button 
      type="button" 
      (click)="onCancel()"
      class="cancel-button">
      {{ cancelText }}
    </button>
    
    <button 
      mat-raised-button 
      color="warn" 
      type="button" 
      (click)="onConfirm()"
      class="confirm-button">
      {{ confirmText }}
    </button>
  </mat-dialog-actions>
</div>
