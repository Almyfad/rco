<div class="blank-layout-container justify-content-center">
    <div class="w-100 position-relative rounded bg-white auth-card">
        <div class="m-t-20">
            <h1 class="text-center">Logout</h1>
            @if(loggedOut()) {
            <p class="text-center">You have been logged out successfully.</p>
            }
            @if(loggingOut()) {
            <div class="d-flex align-items-center justify-content-center">
                <mat-spinner class="d-block mx-auto" diameter="50"></mat-spinner>
                <p class="text-center mt-3">Logging you out...</p>
            </div>
            }
        </div>
    </div>
</div>
